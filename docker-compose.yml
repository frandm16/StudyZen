services:
  db:
    image: postgres:16
    container_name: studytracker-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studytracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_PRIVATE_PORT: ${BACKEND_PRIVATE_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-key-studyzen-at-least-32-bytes!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7777}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PUBLIC_PORT:-8082}:${BACKEND_PRIVATE_PORT:-8080}"

  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: studytracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-7777}:80"

volumes:
  postgres_data:
